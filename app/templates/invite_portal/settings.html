{% extends "invite_portal/base.html" %}{% block content %}<section class="form-card"><p class="eyebrow">הזמנה אחת לכולם</p><h1>תמונת ההזמנה</h1>{% if settings.image_filename %}<img class="invite-image" src="{{ url_for('invite_portal.image') }}?v={{ settings.updated_at.timestamp()|int }}" alt="תמונת הזמנה">{% else %}<p>עדיין לא הועלתה תמונה.</p>{% endif %}<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{{ form.image(accept="image/png,image/jpeg,image/webp") }}{{ form.submit(class_="action main") }}</form></section>{% endblock %}

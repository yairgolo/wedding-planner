<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#815d67"><title>{% block title %}שולחים הזמנה{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/invite_portal.css') }}"></head><body><div class="petal petal-one"></div><div class="petal petal-two"></div><main class="portal-shell"><header class="portal-header"><a class="brand" href="{{ url_for('invite_portal.admin_index') if admin else url_for('invite_portal.user_index', token=sender.access_token) }}"><span>✿</span><b>שולחים הזמנה</b></a>{% if admin %}<nav><a href="{{ url_for('invite_portal.admin_index') }}">מוזמנים</a><a href="{{ url_for('invite_portal.admin_senders') }}">שולחים</a><a href="{{ url_for('invite_portal.admin_settings') }}">הגדרות</a><form method="post" action="{{ url_for('invite_portal.admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>יציאה</button></form></nav>{% elif sender %}<span class="sender-chip">{{ sender.role }} · {{ sender.name }}</span>{% endif %}</header>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>

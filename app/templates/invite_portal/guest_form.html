{% extends "invite_portal/base.html" %}{% block content %}<section class="form-card"><p class="eyebrow">מוזמן</p><h1>{% if guest.id %}עריכת מוזמן{% else %}הוספת מוזמן{% endif %}</h1><form method="post" class="fields">{{ form.hidden_tag() }}<label>{{ form.first_name.label }}{{ form.first_name(placeholder="למשל: יצחק והילה") }}</label><label>{{ form.last_name.label }}{{ form.last_name() }}</label><label>{{ form.phone.label }}{{ form.phone(inputmode="tel",placeholder="0501234567") }}</label>{% if admin %}<label>{{ form.side.label }}{{ form.side() }}</label>{% else %}{{ form.side(type="hidden") }}{% endif %}<label>{{ form.salutation.label }}{{ form.salutation() }}<small>חובה לבחור ידנית כדי למנוע טעויות.</small></label><label>{{ form.group_name.label }}{{ form.group_name() }}</label><label class="wide">{{ form.notes.label }}{{ form.notes(rows=3) }}</label>{{ form.submit(class_="action main") }}</form></section>{% endblock %}

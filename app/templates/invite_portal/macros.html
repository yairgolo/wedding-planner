{% macro errors(form) %}
{% if form.errors %}<div class="notice error wide" role="alert"><strong>יש לתקן את השדות הבאים:</strong><ul>{% for name,messages in form.errors.items() %}{% for message in messages %}<li>{{ form[name].label.text }}: {{ message }}</li>{% endfor %}{% endfor %}</ul></div>{% endif %}
{% endmacro %}
